name: mh_wiki
description: "Offline wiki of large monsters from MH World: Iceborne, Rise: Sunbreak and Wilds."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/world_iceborne/
    - assets/data/rise_sunbreak/
    - assets/data/wilds/
    - assets/images/monsters/world_iceborne/
    - assets/images/monsters/rise_sunbreak/
    - assets/images/monsters/wilds/
    - assets/images/games/
    - assets/images/weapons/rise_sunbreak/
    - assets/images/weapons/types/
    - assets/images/weapons/slots/

  # Bundled so they work offline (SIL Open Font License, see assets/fonts/*/OFL.txt).
  fonts:
    - family: IMFellEnglishSC
      fonts:
        - asset: assets/fonts/im_fell_english_sc/IMFeENsc28P.ttf
    - family: AveriaSerifLibre
      fonts:
        - asset: assets/fonts/averia_serif_libre/AveriaSerifLibre-Regular.ttf
          weight: 400
        - asset: assets/fonts/averia_serif_libre/AveriaSerifLibre-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Italic.ttf
          weight: 400
          style: italic
